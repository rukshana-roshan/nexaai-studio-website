# MySQL Profile Configuration for Production
# Activate using: --spring.profiles.active=mysql or SPRING_PROFILES_ACTIVE=mysql

spring.datasource.url=jdbc:mysql://localhost:3306/smartshop_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
