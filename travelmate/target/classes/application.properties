# =======================================================
# TravelMate - Smart Tourist Day-Visit Planner Config
# =======================================================
server.port=8080

# Application Details
spring.application.name=travelmate-backend

# Default H2 In-Memory Database (Zero config, immediate local execution)
spring.datasource.url=jdbc:h2:mem:travelmatedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (available at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate settings
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Static resource handling
spring.web.resources.static-locations=classpath:/static/
