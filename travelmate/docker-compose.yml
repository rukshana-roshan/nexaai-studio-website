version: '3.8'

services:
  # MySQL Database Service (SRS Section 6.1)
  travelmate-mysql:
    image: mysql:8.0
    container_name: travelmate-mysql
    restart: always
    environment:
      MYSQL_DATABASE: travelmate_db
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: travelmate_user
      MYSQL_PASSWORD: travelmate_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
